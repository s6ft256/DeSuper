services:
  - type: web
    name: desuper
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MODEL_URL
        value: https://github.com/s6ft256/DeSuper/releases/download/Cai/Qwen2.5-Coder-0.5B-Instruct-abliterated-f16.gguf
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: model-storage
      mountPath: /app/models
      sizeGB: 2
